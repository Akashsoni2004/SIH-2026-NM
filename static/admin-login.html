<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrator Console — PAIMANA AI | MoSPI IPMD</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="auth-body admin-auth-body">
    <div class="auth-wrapper">
        <div class="auth-card glass-panel admin-auth-card">
            <div class="auth-header">
                <div class="admin-security-badge">
                    <i data-lucide="shield-alert"></i>
                    <span>RESTRICTED ACCESS • AUDITED ENVIRONMENT</span>
                </div>
                <h1 class="auth-title admin-title">PAIMANA AI</h1>
                <p class="auth-sub">Central System Administration & Governance Console</p>
                <span class="auth-dept">Ministry of Statistics & Programme Implementation • IPMD</span>
            </div>

            <!-- Login Form -->
            <form id="admin-login-form" class="auth-form">
                <div id="auth-alert" class="alert-box d-none"></div>

                <div class="form-group">
                    <label for="username">Administrator Email / ID</label>
                    <div class="input-wrap">
                        <i data-lucide="shield" class="input-icon"></i>
                        <input type="text" id="username" name="username" placeholder="e.g. admin@paimana.gov.in" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Administrative Password</label>
                        <a href="javascript:void(0)" class="forgot-link" onclick="fillAdminCreds()">Use Demo Admin Creds</a>
                    </div>
                    <div class="input-wrap">
                        <i data-lucide="key" class="input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter secure administrator password" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-pwd" id="toggle-pwd" aria-label="Toggle Password Visibility">
                            <i data-lucide="eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Maintain secure session token</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-warning btn-block btn-auth" id="btn-submit">
                    <i data-lucide="lock"></i>
                    <span id="btn-text">Authenticate Administrator</span>
                </button>
            </form>

            <!-- Pre-configured Admin Demo Quick Fill -->
            <div class="demo-accounts-card admin-demo-card">
                <button type="button" class="demo-pill admin-pill" onclick="fillAdminCreds()">
                    <i data-lucide="shield-check"></i>
                    <span class="pill-role">LOAD SYSTEM ADMINISTRATOR CREDENTIALS</span>
                    <span class="pill-desc">Dr. Rajesh Verma • MoSPI IPMD Headquarters</span>
                </button>
            </div>

            <!-- Portal Switcher Footer -->
            <div class="auth-footer">
                <p>Not a system administrator? <a href="/login" class="user-portal-link">&larr; Return to Government User Portal</a></p>
                <div class="auth-bottom-links">
                    <a href="/">← Return to Public Homepage</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        lucide.createIcons();

        function fillAdminCreds() {
            document.getElementById("username").value = "admin@paimana.gov.in";
            document.getElementById("password").value = "Admin@2026";
            const alertBox = document.getElementById("auth-alert");
            alertBox.className = "alert-box alert-info";
            alertBox.textContent = "Admin credentials filled. Click 'Authenticate Administrator' to proceed.";
            alertBox.classList.remove("d-none");
        }

        // Toggle Password
        const toggleBtn = document.getElementById("toggle-pwd");
        const pwdInput = document.getElementById("password");
        toggleBtn.addEventListener("click", () => {
            const isPwd = pwdInput.type === "password";
            pwdInput.type = isPwd ? "text" : "password";
            toggleBtn.innerHTML = `<i data-lucide="${isPwd ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons();
        });

        // Form Submit
        const form = document.getElementById("admin-login-form");
        const alertBox = document.getElementById("auth-alert");
        const submitBtn = document.getElementById("btn-submit");
        const btnText = document.getElementById("btn-text");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertBox.classList.add("d-none");
            submitBtn.disabled = true;
            btnText.textContent = "Verifying Security Clearance...";

            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value;

            try {
                const res = await Auth.login(u, p, "admin");
                alertBox.className = "alert-box alert-success";
                alertBox.textContent = `Clearance Granted: ${res.user.full_name}. Entering Administrative Console...`;
                alertBox.classList.remove("d-none");
                
                setTimeout(() => {
                    window.location.href = "/admin/dashboard";
                }, 700);
            } catch (err) {
                alertBox.className = "alert-box alert-danger";
                alertBox.textContent = err.message || "Administrative authentication failed.";
                alertBox.classList.remove("d-none");
                submitBtn.disabled = false;
                btnText.textContent = "Authenticate Administrator";
            }
        });
    </script>
</body>
</html>
