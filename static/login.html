<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Sign In — PAIMANA AI | Government Project Monitoring Portal</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <!-- Auth Card -->
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <a href="/" class="auth-brand" title="Return to Homepage">
                    <div class="emblem-circle">
                        <i data-lucide="shield-alert" class="brand-icon"></i>
                    </div>
                </a>
                <span class="auth-dept">GOVERNMENT OF INDIA • MoSPI / IPMD</span>
                <h1 class="auth-title">PAIMANA AI</h1>
                <p class="auth-sub">Government Infrastructure Monitoring Portal</p>
            </div>

            <!-- Login Form -->
            <form id="user-login-form" class="auth-form">
                <div id="auth-alert" class="alert-box d-none"></div>

                <div class="form-group">
                    <label for="username">Email or Official Username</label>
                    <div class="input-wrap">
                        <i data-lucide="user" class="input-icon"></i>
                        <input type="text" id="username" name="username" placeholder="e.g. policymaker@paimana.gov.in" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Password</label>
                        <a href="javascript:void(0)" class="forgot-link" onclick="alert('For evaluation demonstration, please select one of the pre-configured role test accounts below.')">Forgot Password?</a>
                    </div>
                    <div class="input-wrap">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your credentials" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-pwd" id="toggle-pwd" aria-label="Toggle Password Visibility">
                            <i data-lucide="eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-label">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Keep me signed in</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-auth" id="btn-submit">
                    <i data-lucide="log-in"></i>
                    <span id="btn-text">Sign In to Platform</span>
                </button>
            </form>

            <!-- Pre-configured Role Selector for Jury Evaluation -->
            <div class="demo-accounts-card">
                <div class="demo-header">
                    <i data-lucide="key-round"></i>
                    <span>Pre-configured Evaluation Accounts (Click to Fill)</span>
                </div>
                <div class="demo-pills">
                    <button type="button" class="demo-pill" onclick="fillCreds('policymaker@paimana.gov.in', 'Policy@2026')">
                        <span class="pill-role">POLICYMAKER</span>
                        <span class="pill-desc">National Portfolio Macro View</span>
                    </button>
                    <button type="button" class="demo-pill" onclick="fillCreds('monitoring@paimana.gov.in', 'Monitor@2026')">
                        <span class="pill-role">MONITORING</span>
                        <span class="pill-desc">Operational Triage & Delay Radar</span>
                    </button>
                    <button type="button" class="demo-pill" onclick="fillCreds('planning@paimana.gov.in', 'Plan@2026')">
                        <span class="pill-role">PLANNING</span>
                        <span class="pill-desc">Capital Spend vs Velocity</span>
                    </button>
                    <button type="button" class="demo-pill agency-pill" onclick="fillCreds('nhai.officer@paimana.gov.in', 'Agency@2026')">
                        <span class="pill-role">AGENCY: NHAI</span>
                        <span class="pill-desc">Strict Data Isolation (Highways)</span>
                    </button>
                    <button type="button" class="demo-pill agency-pill" onclick="fillCreds('aai.officer@paimana.gov.in', 'Agency@2026')">
                        <span class="pill-role">AGENCY: AAI</span>
                        <span class="pill-desc">Strict Data Isolation (Airports)</span>
                    </button>
                    <button type="button" class="demo-pill agency-pill" onclick="fillCreds('railways.officer@paimana.gov.in', 'Agency@2026')">
                        <span class="pill-role">AGENCY: RAIL</span>
                        <span class="pill-desc">Strict Data Isolation (Railways)</span>
                    </button>
                </div>
            </div>

            <!-- Portal Switcher Footer -->
            <div class="auth-footer">
                <p>System Administrator? <a href="/admin/login" class="admin-link">Access Administrator Portal &rarr;</a></p>
                <div class="auth-bottom-links">
                    <a href="/">← Return to Public Homepage</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        lucide.createIcons();

        function fillCreds(u, p) {
            document.getElementById("username").value = u;
            document.getElementById("password").value = p;
            const alertBox = document.getElementById("auth-alert");
            alertBox.className = "alert-box alert-info";
            alertBox.textContent = `Selected demo account: ${u}. Click "Sign In" to proceed.`;
            alertBox.classList.remove("d-none");
        }

        // Toggle Password
        const toggleBtn = document.getElementById("toggle-pwd");
        const pwdInput = document.getElementById("password");
        toggleBtn.addEventListener("click", () => {
            const isPwd = pwdInput.type === "password";
            pwdInput.type = isPwd ? "text" : "password";
            toggleBtn.innerHTML = `<i data-lucide="${isPwd ? 'eye-off' : 'eye'}"></i>`;
            lucide.createIcons();
        });

        // Form Submit
        const form = document.getElementById("user-login-form");
        const alertBox = document.getElementById("auth-alert");
        const submitBtn = document.getElementById("btn-submit");
        const btnText = document.getElementById("btn-text");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            alertBox.classList.add("d-none");
            submitBtn.disabled = true;
            btnText.textContent = "Verifying Credentials...";

            const u = document.getElementById("username").value.trim();
            const p = document.getElementById("password").value;

            try {
                const res = await Auth.login(u, p, "user");
                alertBox.className = "alert-box alert-success";
                alertBox.textContent = `Welcome, ${res.user.full_name} (${res.user.role}). Redirecting to your dashboard...`;
                alertBox.classList.remove("d-none");
                
                setTimeout(() => {
                    const params = new URLSearchParams(window.location.search);
                    const redirectUrl = params.get("redirect") || "/dashboard";
                    window.location.href = redirectUrl;
                }, 700);
            } catch (err) {
                alertBox.className = "alert-box alert-danger";
                alertBox.textContent = err.message || "Invalid credentials.";
                alertBox.classList.remove("d-none");
                submitBtn.disabled = false;
                btnText.textContent = "Sign In to Platform";
            }
        });
    </script>
</body>
</html>
