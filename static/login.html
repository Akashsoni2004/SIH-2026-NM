<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Sign In — PAIMANA AI | Government Infrastructure Command Center</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/css/styles.css?v=2.4.0">
    <link rel="icon" type="image/png" href="/static/img/paimana-logo.png">
    <link rel="apple-touch-icon" href="/static/img/paimana-logo.png">
    <!-- Theme Manager -->
    <script src="/static/js/theme.js?v=2.4.0"></script>
</head>
<body class="auth-body">
    <div style="position: absolute; top: 1.5rem; right: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
        <button class="topbar-icon-btn theme-toggle-btn" id="login-theme-toggle" aria-label="Toggle Theme" title="Toggle Light / Dark Mode">
            <i data-lucide="moon" class="theme-icon"></i>
        </button>
        <a href="/" class="btn btn-outline btn-sm">
            <i data-lucide="arrow-left"></i>
            <span>Portal Home</span>
        </a>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
        <div class="auth-header">
            <a href="/" class="sidebar-brand" style="text-decoration: none; justify-content: center; margin-bottom: 0.5rem;">
                <div class="emblem-wrapper">
                    <img src="/static/img/paimana-logo.png" alt="PAIMANA AI Logo" class="brand-logo-img brand-logo-lg">
                </div>
            </a>
            <span class="auth-dept">GOVERNMENT OF INDIA • MoSPI / IPMD</span>
            <h1 class="auth-title">PAIMANA <span style="color:var(--brand-accent)">AI</span></h1>
            <p class="auth-sub">National Infrastructure Intelligence Command Center</p>
        </div>

        <!-- Login Form -->
        <form id="user-login-form" class="auth-form">
            <div id="auth-alert" class="alert-box d-none" style="padding: 0.75rem; border-radius: var(--radius-md); font-size: 0.82rem; margin-bottom: 0.5rem;"></div>

            <div class="form-group">
                <label for="username">Email or Official Username</label>
                <div class="input-wrap">
                    <i data-lucide="user" class="input-icon"></i>
                    <input type="text" id="username" name="username" class="form-input" placeholder="e.g. policymaker@paimana.gov.in" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="password">Password</label>
                    <a href="javascript:void(0)" onclick="alert('For evaluation demonstration, click one of the quick test accounts below.')" style="font-size: 0.75rem;">Forgot Password?</a>
                </div>
                <div class="input-wrap">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter credentials" required autocomplete="current-password">
                    <button type="button" id="toggle-pwd" style="position: absolute; right: 0.75rem; background: transparent; border: none; color: var(--text-muted); cursor: pointer;">
                        <i data-lucide="eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="btn-submit" style="height: 46px; font-size: 0.95rem;">
                <i data-lucide="log-in"></i>
                <span id="btn-text">Sign In to Platform</span>
            </button>
        </form>

        <!-- Evaluation Test Accounts Selection -->
        <div class="demo-pills-card">
            <span class="demo-pills-label"><i data-lucide="key-round" style="width: 14px; height: 14px; vertical-align: middle;"></i> Evaluation Test Accounts (Click to Fill)</span>
            <div class="demo-pills-grid">
                <button type="button" class="demo-pill-btn" onclick="fillCreds('policymaker@paimana.gov.in', 'Policy@2026')">
                    <span class="role-pill role-policymaker" style="display: block; margin-bottom: 2px;">POLICYMAKER</span>
                    <span style="font-size: 0.68rem; color: var(--text-muted);">Smt. Ananya Sen</span>
                </button>
                <button type="button" class="demo-pill-btn" onclick="fillCreds('monitoring@paimana.gov.in', 'Monitor@2026')">
                    <span class="role-pill role-monitoring" style="display: block; margin-bottom: 2px;">MONITORING</span>
                    <span style="font-size: 0.68rem; color: var(--text-muted);">Shri Vikram Malhotra</span>
                </button>
                <button type="button" class="demo-pill-btn" onclick="fillCreds('planning@paimana.gov.in', 'Plan@2026')">
                    <span class="role-pill role-planning" style="display: block; margin-bottom: 2px;">PLANNING</span>
                    <span style="font-size: 0.68rem; color: var(--text-muted);">Dr. Meenakshi S.</span>
                </button>
                <button type="button" class="demo-pill-btn" onclick="fillCreds('nhai.officer@paimana.gov.in', 'Agency@2026')">
                    <span class="role-pill role-agency" style="display: block; margin-bottom: 2px;">AGENCY: NHAI</span>
                    <span style="font-size: 0.68rem; color: var(--text-muted);">Eng. Sunil Deshmukh</span>
                </button>
            </div>
        </div>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.8rem; color: var(--text-muted);">
            System Administrator? <a href="/admin/login" style="font-weight: 700;">Administrator Portal &rarr;</a>
        </div>
    </div>

    <script src="/static/js/auth.js?v=2.4.0"></script>
    <script>
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
        }

        function fillCreds(u, p) {
            document.getElementById("username").value = u;
            document.getElementById("password").value = p;
            const alertBox = document.getElementById("auth-alert");
            alertBox.style.background = "var(--brand-accent-subtle)";
            alertBox.style.color = "var(--brand-accent)";
            alertBox.style.border = "1px solid var(--border-subtle)";
            alertBox.textContent = `Selected: ${u}. Click "Sign In to Platform" to proceed.`;
            alertBox.classList.remove("d-none");
        }

        // Toggle Password
        const toggleBtn = document.getElementById("toggle-pwd");
        const pwdInput = document.getElementById("password");
        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener("click", () => {
                const isPwd = pwdInput.type === "password";
                pwdInput.type = isPwd ? "text" : "password";
                toggleBtn.innerHTML = `<i data-lucide="${isPwd ? 'eye-off' : 'eye'}"></i>`;
                lucide.createIcons();
            });
        }

        // Handle Login Submission
        document.getElementById("user-login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btn-submit");
            const alertBox = document.getElementById("auth-alert");
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;

            btn.disabled = true;
            btn.innerHTML = `<span>Verifying credentials...</span>`;
            alertBox.classList.add("d-none");

            try {
                const data = await Auth.login(username, password, "user");
                alertBox.style.background = "var(--risk-low-bg)";
                alertBox.style.color = "var(--risk-low-text)";
                alertBox.style.border = "1px solid var(--risk-low-border)";
                alertBox.textContent = `Welcome, ${data.user.full_name}. Access authorized.`;
                alertBox.classList.remove("d-none");

                setTimeout(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get("redirect") || "/dashboard";
                    window.location.href = redirect;
                }, 600);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="log-in"></i><span>Sign In to Platform</span>`;
                alertBox.style.background = "var(--risk-high-bg)";
                alertBox.style.color = "var(--risk-high-text)";
                alertBox.style.border = "1px solid var(--risk-high-border)";
                alertBox.textContent = err.message;
                alertBox.classList.remove("d-none");
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
